# `fuzi`, `fuzi_core`, and `fuz_archive` carry their own `clippy.toml` (the
# exec-free disallows), which REPLACES this one: a setting added here must be
# copied into each (`fuzi_core`'s `tests/exec_free.rs` fails until it is).
#
# Restriction lints (`unwrap_used` / `expect_used` / `panic`) are warn-level
# workspace-wide (see Cargo.toml `[workspace.lints.clippy]`) so production
# panic points need an explicit justified `#[allow]`. Tests panic on assertion
# failure by design, so allow the three there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Every `$HOME` lookup goes through `fuz_sys::home_dir`, which refuses an empty
# or relative home; std's own reads an empty `HOME` as unset and substitutes
# the password database's home. `fuz_sys` itself carries the one `#[allow]`.
disallowed-methods = [
    { path = "std::env::home_dir", reason = "use fuz_sys::home_dir: it refuses an empty or relative HOME" },
]
