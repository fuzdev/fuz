[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argh.workspace = true
base64.workspace = true
fuz_artifact.workspace = true
fuz_audit.workspace = true
fuz_home.workspace = true
fuz_sys = { workspace = true, features = ["argh"] }
fuz_crypto.workspace = true
fuz_release.workspace = true
fuz_sign.workspace = true
fuz_storage.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only stub executables for the publish suites (`tests/storage.rs`).
fuz_artifact = { workspace = true, features = ["test_binary_stubs"] }

[lints]
workspace = true

# Dev tooling — exempt from `fuz_audit`'s production-binary scan so
# `cargo xtask check-release` can itself depend on `fuz_audit`.
[package.metadata.fuz_audit]
dev_only = true
