[package]
name = "fuz_fact_serving"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Cell-gated fact serving for the fuz spine — the sole authz'd reader-facade over fuz_fact. axum routers (cell-scoped per-reference + admin-only bare-hash) twinning fuz_app's serve_fact_route.ts; composes fuz_cell::can_view_cell + the cell→fact edge check."

[dependencies]
fuz_fact.workspace = true
fuz_cell.workspace = true
fuz_auth.workspace = true
fuz_crypto.workspace = true
fuz_db.workspace = true
fuz_http.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
deadpool-postgres.workspace = true
uuid.workspace = true
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Dev-only: the shared PG-suite harness (`fuz_testing::fresh_db`).
fuz_testing.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
# Dev-only: the suite asserts the flat `{error}` denial bodies.
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
