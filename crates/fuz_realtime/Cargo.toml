[package]
name = "fuz_realtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Realtime transport for the fuz spine — WebSocket and SSE connection registries, broadcast, identity-keyed revocation (RealtimeCloser), the admin audit stream, notify + cancellation seam"

[dependencies]
fuz_auth.workspace = true
fuz_db.workspace = true
fuz_http.workspace = true
fuz_sys.workspace = true
axum.workspace = true
tungstenite.workspace = true
tokio.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util.workspace = true
futures.workspace = true
uuid.workspace = true

[dev-dependencies]
# Dev-only: the shared PG-suite harness (`fuz_testing::fresh_db` + `seed`) for
# the `#[ignore]` `audit_stream` route suite.
fuz_testing.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
